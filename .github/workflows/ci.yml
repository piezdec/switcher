name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Тесты
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Сборка
        run: cargo build --release -p switcher
      - name: Контрольная сумма
        run: (Get-FileHash target/release/switcher.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline target/release/switcher.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: switcher
          path: |
            target/release/switcher.exe
            target/release/switcher.exe.sha256
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/switcher.exe
            target/release/switcher.exe.sha256
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Системные библиотеки
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Тесты
        run: cargo test --workspace --exclude platform-win
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude platform-win -- -D warnings
      - name: Сборка
        run: |
          cargo build --release -p switcher
          cp target/release/switcher switcher-linux-x86_64
          sha256sum switcher-linux-x86_64 | cut -d' ' -f1 > switcher-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: switcher-linux
          path: |
            switcher-linux-x86_64
            switcher-linux-x86_64.sha256
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            switcher-linux-x86_64
            switcher-linux-x86_64.sha256
