[workspace]
resolver = "2"
members = [
    "crates/layouts",
    "crates/langmodel",
    "crates/engine",
    "crates/platform-win",
    "crates/platform-linux",
    "crates/app",
    "tools/trainer",
    "tools/eval",
]

[workspace.package]
version = "0.3.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
layouts = { path = "crates/layouts" }
langmodel = { path = "crates/langmodel" }
engine = { path = "crates/engine" }
platform-win = { path = "crates/platform-win" }
platform-linux = { path = "crates/platform-linux" }
windows-sys = "0.59"
windows = "0.62"
fst = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.11"
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
